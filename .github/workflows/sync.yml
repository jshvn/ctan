name: sync
on:
  schedule:
    - cron: '30 3 * * *'   # dante publishes tlnet daily; pick a slot after the mirrors catch up
  workflow_dispatch:
permissions:
  contents: read
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # four times the slowest run seen; every step has its own timeout
    env:
      # The AWS CLI ships on ubuntu-latest; these four env vars are its whole R2 config.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - run: aws --version   # record in every run's log which build did the upload
      - run: task sync
