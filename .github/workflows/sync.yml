name: sync
on:
  schedule:
    - cron: '42 * * * *'   # hourly at a fixed minute; runs start 15 to 45 minutes after it
  workflow_dispatch:
    inputs:
      seed:
        description: 'The bucket is empty and there is no state file: upload everything'
        type: boolean
        default: false
      reconcile:
        description: 'List the bucket and rebuild the state this run (also bootstraps a missing state)'
        type: boolean
        default: false
      max_batches:
        description: 'Batches to work this run (4 GB each; the rest wait for the next hour)'
        type: string
        default: '4'
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false   # one run at a time; a slot that fires during a run waits and starts the moment it ends
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 6-hour job limit; every batch checkpoints, so a cut-off costs one batch
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      # Builds the toolbox and prints the versions the run will use. df is the host's:
      # the image and the batches share the runner's disk, and the batch budget is that disk.
      - run: df -h . && task run -- sh -c 'aws --version && rsync --version | head -1'
      # The pipeline runs inside the image, so its environment is docker/Dockerfile and not
      # whatever ubuntu-latest ships this month. go-task reports 201 for any inner failure;
      # nonzero is all the job needs.
      - run: >-
          task run -- task sync
          SEED=${{ inputs.seed == true }}
          RECONCILE=${{ inputs.reconcile == true && 'true' || 'auto' }}
          MAX_BATCHES=${{ inputs.max_batches || '4' }}
