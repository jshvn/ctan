<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ctan.ijosh.com</title>
<style>
  :root { --fg: #1f2328; --bg: #ffffff; --muted: #59636e; --line: #d1d9e0; --code: #f6f8fa; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f0f6fc; --bg: #0d1117; --muted: #9198a1; --line: #3d444d; --code: #151b23; --link: #4493f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { margin: 1.5em 0 0.5em; line-height: 1.25; }
  h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--line); margin-top: 0; }
  h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
  p, ol, ul { margin: 0 0 1em; }
  code, pre { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 85%; }
  code { background: var(--code); padding: .2em .4em; border-radius: 6px; }
  pre { background: var(--code); padding: 1em; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  img { max-width: 100%; }
  header { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; padding-bottom: .75rem; border-bottom: 1px solid var(--line); font-size: 85%; }
  header a { color: var(--muted); }
  header a:hover { color: var(--link); }
  header nav a + a { margin-left: 1rem; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 85%; }
</style>
</head>
<body>
<main>
<header>
  <a href="/">ctan.ijosh.com</a>
  <nav>
    <a href="https://github.com/jshvn/ctan">GitHub</a>
    <a href="https://ijosh.com">ijosh.com</a>
  </nav>
</header>
<!--README-->
<footer>Last updated <!--UPDATED-->.</footer>
</main>
</body>
</html>
