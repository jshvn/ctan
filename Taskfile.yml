# Mirror the TeX Live network repository (CTAN systems/texlive/tlnet) into a
# Cloudflare R2 bucket. Runs the same way locally and inside GitHub Actions.
#
# Remote "r2" is defined entirely by environment variables (no rclone.conf):
#   RCLONE_CONFIG_R2_TYPE=s3  RCLONE_CONFIG_R2_PROVIDER=Cloudflare
#   RCLONE_CONFIG_R2_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
#   RCLONE_CONFIG_R2_ACCESS_KEY_ID / RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
version: '3'

vars:
  # The CTAN master host. Secondary mirrors can lag it by a day; the master cannot.
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/systems/texlive/tlnet/
  # A stalled sender fails in 5 minutes instead of holding the job to its 120-minute limit.
  RSYNC_TIMEOUTS: --timeout=300 --contimeout=60
  STAGING: '{{.ROOT_DIR}}/staging'
  # Objects live under CTAN's own path so https://ctan.ijosh.com/systems/texlive/tlnet/
  # is a drop-in mirror URL and the rest of CTAN can be fronted later without moving them.
  BUCKET: r2:tlnet/systems/texlive/tlnet
  URL: https://ctan.ijosh.com/systems/texlive/tlnet
  # R2 free tier is 10 GB-month; both limits are decimal GB in MiB (the smaller unit,
  # so a billing-side GB never comes out larger than what we measured).
  HARD_MB: 9537   # 10 GB: never publish a tree that would bill
  SOFT_MB: 8583   #  9 GB: publish, then fail the job so GitHub emails an alert
  # --checksum: local MD5 vs R2 ETag, so an in-place revision bump of foo.tar.xz
  #   (same name, maybe same size) is always detected.
  # --s3-upload-cutoff 200M: largest tlnet file is ~145 MB, so every upload is a
  #   single PutObject (one Class A op) instead of a multipart trio.
  # --s3-no-check-bucket: object-scoped R2 tokens cannot HeadBucket.
  RCLONE_FLAGS: >-
    --checksum --transfers 32 --checkers 32 --s3-upload-cutoff 200M
    --s3-no-check-bucket --fast-list --stats-one-line -v

tasks:
  default:
    cmds: [{task: sync}]

  sync:
    desc: fetch -> verify -> publish -> smoke -> ping; refuses to bill past 10 GB, alerts past 9 GB
    cmds:
      - {task: fetch}
      - {task: verify}
      - {task: guard, vars: {LIMIT_MB: '{{.HARD_MB}}'}}
      - {task: publish}
      - {task: smoke}
      - {task: ping}
      - {task: guard, vars: {LIMIT_MB: '{{.SOFT_MB}}'}}

  fetch:
    desc: Pull tlnet, dereferencing symlinks (tlmgr requests foo.tar.xz, never foo.r123.tar.xz)
    cmds:
      - mkdir -p {{.STAGING}}
      # -L turns each unversioned symlink into a real file; the exclude drops the
      # versioned originals so nothing is stored twice.
      - >-
        rsync -rLt {{.RSYNC_TIMEOUTS}} --delete --delete-excluded --partial --info=stats1
        --exclude='*.r[0-9]*.tar.xz' --exclude='/update-tlmgr-r*'
        {{.SOURCE}} {{.STAGING}}/

  verify:
    desc: Refuse to publish a tree that is tampered, mid-update, missing or corrupt containers, or holding duplicates
    dir: '{{.STAGING}}/tlpkg'
    vars:
      # TeX Live Distribution primary key, published at tug.org/texlive/verify.html
      TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC
    env:
      # Short path on purpose: gpg-agent's unix socket has a ~100 char path limit.
      GNUPGHOME: /tmp/tlnet-gnupg
    cmds:
      - shasum -a 512 -c texlive.tlpdb.sha512
      - mkdir -p -m 700 "$GNUPGHOME" && gpg -q --import gpg/pubring.gpg
      # The keyring came from the same mirror as the signature, so pin the
      # fingerprint: VALIDSIG's last field is the primary key that signed.
      - gpg --status-fd 1 --verify texlive.tlpdb.sha512.asc texlive.tlpdb.sha512 | grep -q 'VALIDSIG .* {{.TL_KEY}}$'
      # A versioned container next to its unversioned copy would double storage.
      - test -z "$(find ../archive -name '*.r[0-9]*.tar.xz' | head -1)"
      # Every container the tlpdb names must exist and match its sha512, so a tree caught
      # between a tlpdb update and its containers is never published. Source containers
      # are <name>.source.tar.xz although the tlpdb field is srccontainerchecksum.
      - >-
        awk '/^name /{n=$2}
        /^containerchecksum /{print $2"  ../archive/"n".tar.xz"}
        /^doccontainerchecksum /{print $2"  ../archive/"n".doc.tar.xz"}
        /^srccontainerchecksum /{print $2"  ../archive/"n".source.tar.xz"}'
        texlive.tlpdb | shasum -a 512 -c --quiet

  guard:
    desc: Fail when staging exceeds LIMIT_MB (du -sm is portable; blocks, so slightly over apparent size)
    requires: {vars: [LIMIT_MB]}
    cmds:
      - 'used=$(du -sm {{.STAGING}} | cut -f1); test "$used" -le {{.LIMIT_MB}} || { echo "staging is ${used} MiB, over the {{.LIMIT_MB}} MiB limit" >&2; exit 1; }'

  publish:
    desc: Containers first, then tlpdb + deletions, so no client sees a tlpdb that names a missing file
    cmds:
      - rclone copy {{.RCLONE_FLAGS}} {{.STAGING}}/archive {{.BUCKET}}/archive
      - rclone sync {{.RCLONE_FLAGS}} {{.STAGING}} {{.BUCKET}}

  smoke:
    desc: Read texlive.tlpdb.sha512 back through the public URL; proves the upload landed and the domain serves it
    cmds:
      - curl -fsS -m 30 {{.URL}}/tlpkg/texlive.tlpdb.sha512 | cmp - {{.STAGING}}/tlpkg/texlive.tlpdb.sha512

  ping:
    desc: Dead man's switch; healthchecks.io emails when a day passes without this (skipped if HEALTHCHECK_URL is unset)
    cmds:
      - test -z "$HEALTHCHECK_URL" || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"

  size:
    desc: Dry-run against upstream and report file count and bytes (no download)
    cmds:
      - >-
        rsync -rLtn {{.RSYNC_TIMEOUTS}} --stats --exclude='*.r[0-9]*.tar.xz' --exclude='/update-tlmgr-r*'
        {{.SOURCE}} /nonexistent | grep -E 'Number of files:|Total file size'
