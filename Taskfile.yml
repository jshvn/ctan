# Mirror the TeX Live network repository (CTAN systems/texlive/tlnet) into a
# Cloudflare R2 bucket. Runs the same way locally and inside GitHub Actions.
#
# R2 is reached through the AWS CLI, configured entirely by environment variables:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   (R2 API token, Object Read & Write)
#   AWS_ENDPOINT_URL=https://<account-id>.r2.cloudflarestorage.com   AWS_REGION=auto
version: '3'

vars:
  # The CTAN master host. Secondary mirrors can lag it by a day; the master cannot.
  SOURCE: rsync://rsync.dante.ctan.org/CTAN/systems/texlive/tlnet/
  # A stalled sender fails in 5 minutes instead of holding the job to its 30-minute limit.
  RSYNC_TIMEOUTS: --timeout=300 --contimeout=60
  STAGING: '{{.ROOT_DIR}}/staging'
  # The custom domain on the bucket. Every public URL derives from it; a fork changes this
  # line and the text in site/index.html.
  HOST: ctan.ijosh.com
  # Objects live under CTAN's own path so https://ctan.ijosh.com/systems/texlive/tlnet/
  # is a drop-in mirror URL and the rest of CTAN can be fronted later without moving them.
  # Bucket names are per account, so a fork keeps the name tlnet.
  PREFIX: systems/texlive/tlnet
  BUCKET: s3://tlnet/{{.PREFIX}}
  URL: https://{{.HOST}}/{{.PREFIX}}
  # Landing page for https://ctan.ijosh.com/: site/index.html uploaded to the bucket root.
  # A Cloudflare Transform Rule rewrites "/" to "/index.html".
  SITE: https://{{.HOST}}
  # Stage output that report reads back. Outside staging so it is never uploaded.
  RUN: /tmp/tlnet-run
  # TeX Live Distribution primary key, published at tug.org/texlive/verify.html
  TL_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC
  # R2 free tier is 10 GB-month, here as decimal GB in MiB (the smaller unit, so a
  # billing-side GB never comes out larger than what we measured). guard prints the size
  # every run, so the trend is in the log long before this trips.
  LIMIT_MB: 9537   # 10 GB: never publish a tree that would bill
  # aws s3 sync uploads when size differs or the local mtime is newer than the
  # object's LastModified. rsync -t keeps upstream mtimes, and a revision bump is
  # always built after our previous upload, so same-size bumps are caught. Never
  # add --size-only. aws.config keeps every upload a single PutObject.
  AWS_FLAGS: --no-progress

env:
  AWS_CONFIG_FILE: '{{.ROOT_DIR}}/aws.config'

tasks:
  default:
    cmds: [{task: sync}]

  sync:
    desc: fetch -> verify -> guard -> publish -> smoke -> report -> ping -> page; refuses to bill past 10 GB
    cmds:
      - {task: fetch}
      - {task: verify}
      - {task: guard}
      - {task: publish}
      - {task: smoke}
      # report, then ping, then page: a healthchecks blip cannot lose the summary, and a broken
      # landing page is one email on a fresh mirror.
      - {task: report}
      - {task: ping}
      - {task: page}

  fetch:
    desc: Pull tlnet, dereferencing symlinks (tlmgr requests foo.tar.xz, never foo.r123.tar.xz)
    set: [pipefail]   # tee must never mask a failed rsync
    cmds:
      - mkdir -p {{.STAGING}} {{.RUN}}
      # -L turns each unversioned symlink into a real file; the exclude drops the
      # versioned originals so nothing is stored twice.
      - >-
        rsync -rLt {{.RSYNC_TIMEOUTS}} --delete --delete-excluded --partial --stats
        --exclude='*.r[0-9]*.tar.xz' --exclude='/update-tlmgr-r*'
        {{.SOURCE}} {{.STAGING}}/ | tee {{.RUN}}/fetch.txt

  verify:
    desc: Refuse to publish a tree that is tampered, mid-update, missing or corrupt containers, or holding duplicates
    dir: '{{.STAGING}}/tlpkg'
    cmds:
      # The tlpdb, the installers and the tlmgr updaters at the tree root each carry a
      # signed sha512; nothing else outside archive/ is signed upstream. gpgv reads the
      # keyring as a plain file, so nothing from the mirror is imported before it is
      # authenticated. The keyring came from the same mirror as the signature, so pin the
      # fingerprint: VALIDSIG's last field is the primary key that signed. GOODSIG as well,
      # because gpgv reports an expired or revoked key as VALIDSIG with exit 0.
      - >-
        for f in texlive.tlpdb.sha512 ../install-tl*.sha512 ../update-tlmgr-latest.*.sha512; do
        (cd "$(dirname "$f")" && f=$(basename "$f") && shasum -a 512 -c "$f" &&
        gpgv --status-fd 1 --keyring {{.STAGING}}/tlpkg/gpg/pubring.gpg "$f.asc" "$f"
        | awk '/^\[GNUPG:\] GOODSIG /{g=1} /^\[GNUPG:\] VALIDSIG .* {{.TL_KEY}}$/{v=1} END{exit !(g&&v)}')
        || exit 1; done
      # tlmgr downloads texlive.tlpdb.xz, not texlive.tlpdb, and checks the signed sha512
      # against what it decompresses, so the pair must be the same bytes.
      - xz -dc texlive.tlpdb.xz | cmp - texlive.tlpdb
      # A versioned container next to its unversioned copy would double storage.
      - test -z "$(find ../archive -name '*.r[0-9]*.tar.xz' | head -1)"
      # Every container the tlpdb names must exist and match its sha512, so a tree caught
      # between a tlpdb update and its containers is never published. Source containers
      # are <name>.source.tar.xz although the tlpdb field is srccontainerchecksum.
      - >-
        awk '/^name /{n=$2}
        /^containerchecksum /{print $2"  ../archive/"n".tar.xz"}
        /^doccontainerchecksum /{print $2"  ../archive/"n".doc.tar.xz"}
        /^srccontainerchecksum /{print $2"  ../archive/"n".source.tar.xz"}'
        texlive.tlpdb | shasum -a 512 -c --quiet

  guard:
    desc: Print the staging size and fail when it exceeds LIMIT_MB (du -sm is portable; blocks, so slightly over apparent size)
    cmds:
      - 'used=$(du -sm {{.STAGING}} | cut -f1); echo "staging is ${used} MiB of the {{.LIMIT_MB}} MiB limit"; test "$used" -le {{.LIMIT_MB}}'

  page:
    desc: Upload site/index.html with the sync date filled in to the bucket root
    dir: '{{.ROOT_DIR}}'
    set: [pipefail]   # a failed sed must never upload an empty page
    cmds:
      # Streamed, so the checked-in file is the only copy. Bucket root, outside the mirror
      # prefix, so the stale listing never sees it. no-cache so the edge and browsers refetch
      # the page every visit; the mirror files are not edge-cached at all.
      - sed "s|<!--UPDATED-->|$(date -u '+%Y-%m-%d %H:%M UTC')|" site/index.html | aws s3 cp {{.AWS_FLAGS}} --content-type text/html --cache-control no-cache - s3://tlnet/index.html

  publish:
    desc: Containers first, then tlpdb, then deletions, so no client sees a tlpdb that names a missing file
    set: [pipefail]   # tee must never mask a failed upload
    cmds:
      - mkdir -p {{.RUN}}
      - aws s3 sync {{.AWS_FLAGS}} {{.STAGING}}/archive {{.BUCKET}}/archive | tee {{.RUN}}/publish.txt
      # Never sync --delete. R2 lists a key after the keys it is a prefix of (install-tl after
      # install-tl.zip.sha512.asc) while the CLI walks staging in byte order, so its merge-join
      # emits both an upload and a delete for every such key and the delete can land last. The
      # re-uploads that remain (15 keys) are harmless; deletions come from our own sorted diff.
      - aws s3 sync {{.AWS_FLAGS}} {{.STAGING}} {{.BUCKET}} | tee -a {{.RUN}}/publish.txt
      - aws s3 ls --recursive {{.BUCKET}}/ | sed 's/^[^ ]* *[^ ]* *[^ ]* //' > {{.RUN}}/remote.txt
      - {task: stale}
      # ponytail: one DeleteObject per key (free on R2, ~1 s each). Batch with s3api
      # delete-objects if a release rollover ever removes thousands of files at once.
      - xargs -r -I{} aws s3 rm s3://tlnet/{} < {{.RUN}}/stale.txt | tee -a {{.RUN}}/publish.txt

  stale:
    desc: Keys in RUN/remote.txt (the bucket listing) that staging no longer has, written to RUN/stale.txt
    cmds:
      - cd {{.STAGING}} && find . -type f | sed 's|^\./|{{.PREFIX}}/|' | LC_ALL=C sort > {{.RUN}}/local.txt
      - test -s {{.RUN}}/local.txt   # an empty tree must never empty the bucket
      - LC_ALL=C sort {{.RUN}}/remote.txt | LC_ALL=C comm -13 {{.RUN}}/local.txt - > {{.RUN}}/stale.txt

  smoke:
    desc: Read texlive.tlpdb.sha512 back through the public URL; proves the upload landed and the domain serves it
    cmds:
      - curl -fsS -m 30 {{.URL}}/tlpkg/texlive.tlpdb.sha512 | cmp - {{.STAGING}}/tlpkg/texlive.tlpdb.sha512

  ping:
    desc: Dead man's switch; healthchecks.io emails when a day passes without this (skipped if HEALTHCHECK_URL is unset)
    cmds:
      - test -z "$HEALTHCHECK_URL" || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"

  report:
    desc: Append the run summary to the Actions job page (stdout elsewhere) from the fetch and publish output in RUN
    silent: true   # do not echo the heredoc into the job log
    cmds:
      # rs: one number from the rsync --stats block. mb: bytes with commas to MB. n: aws s3 sync lines by verb.
      - |
        rs() { sed -n "s/^$1: *\([0-9,]*\).*/\1/p" {{.RUN}}/fetch.txt; }
        mb() { awk -v b="$1" 'BEGIN { gsub(",", "", b); printf "%.1f MB", b / 1e6 }'; }
        n() { grep -c "^$1:" {{.RUN}}/publish.txt || true; }
        cat >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}" <<EOF
        ## Sync succeeded, $(date -u '+%Y-%m-%d %H:%M UTC')

        | Mirror | $(sed -n 's/^Number of files: .*reg: \([0-9,]*[0-9]\).*/\1/p' {{.RUN}}/fetch.txt) files, $(mb "$(rs 'Total file size')") at [{{.URL}}/]({{.URL}}/) |
        |---|---|
        | Fetched from CTAN | $(rs 'Number of regular files transferred') files, $(mb "$(rs 'Total transferred file size')"); $(rs 'Number of deleted files') removed upstream |
        | Published to R2 | $(n upload) uploaded, $(n delete) deleted |
        | Storage | $(du -sm {{.STAGING}} | cut -f1) MiB of the {{.LIMIT_MB}} MiB limit |
        | Signature | texlive.tlpdb.sha512, the installers and the tlmgr updaters signed by TeX Live key {{.TL_KEY}}; texlive.tlpdb.xz matches; every container matches its tlpdb checksum |
        | Read-back | [texlive.tlpdb.sha512]({{.URL}}/tlpkg/texlive.tlpdb.sha512) served from the domain matches the tree just published |
        | Landing page | [{{.SITE}}]({{.SITE}}/), re-uploaded after this summary |

        <details><summary>rsync stats</summary>

        \`\`\`
        $(cat {{.RUN}}/fetch.txt)
        \`\`\`
        </details>
        EOF
